<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0e">
  <title>Forge</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <div id="scene"></div><div id="orb"></div><canvas id="snow"></canvas>
  <main id="app"></main>
  <nav id="nav">
    <button class="on" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Log</button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16M8 15l3.5-4 3 2.5L20 7"/></svg>Progress</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</button>
  </nav>
  <div id="rest"></div>
  <div id="pad"></div>
  <script>
    // Boot guard: if the app has drawn nothing after 4 seconds, say why and offer a safe fix (your workouts are not touched).
    (function () {
      var errs = [];
      addEventListener("error", function (e) { errs.push(e.message || "Could not load " + (e.target && (e.target.src || e.target.href))); }, true);
      addEventListener("unhandledrejection", function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () {
        var app = document.getElementById("app");
        if (!app || app.children.length) return;
        var box = document.createElement("div");
        box.style.cssText = "padding:24px;font:16px system-ui;color:#eee";
        var h = document.createElement("h2"); h.textContent = "Forge could not start";
        var p = document.createElement("p"); p.style.color = "#aaa"; p.textContent = errs.join(" / ") || "No error message was reported.";
        var n = document.createElement("p"); n.style.color = "#aaa"; n.textContent = "Your workouts are safe. This only refreshes the app files.";
        var b = document.createElement("button"); b.textContent = "Refresh app files";
        b.style.cssText = "padding:14px 20px;border-radius:12px;border:0;font:inherit;background:#ee8a3b;color:#1c1008";
        b.onclick = async function () {
          try {
            var rs = await navigator.serviceWorker.getRegistrations(); for (var r of rs) await r.unregister();
            var ks = await caches.keys(); for (var k of ks) await caches.delete(k);
          } catch (e) {}
          location.reload();
        };
        box.append(h, p, n, b); app.append(box);
      }, 4000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
